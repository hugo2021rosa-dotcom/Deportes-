<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deportes</title>
<meta name="theme-color" content="#0a1230">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon%20(1).png">
<link rel="apple-touch-icon" href="icon-192%20(1).png">
<style>
:root{--bg:#0a1230;--bg2:#111c42;--line:#24335f;--txt:#eef3ff;--mut:#8fa0cf;--blue:#2fa3ff;--org:#ff8a1f;--ok:#3ddc97}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 0% 0%,#10306b55,transparent),radial-gradient(900px 600px at 100% 0%,#ff8a1f33,transparent),var(--bg);color:var(--txt);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;padding-bottom:84px}
header{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 16px 10px}
header img{width:46px;height:46px;border-radius:12px}
header h1{margin:0;font-size:1.5rem;letter-spacing:.5px;background:linear-gradient(90deg,var(--blue),var(--org));-webkit-background-clip:text;background-clip:text;color:transparent}
main{max-width:640px;margin:0 auto;padding:0 14px}
h2{font-size:1.1rem;margin:18px 0 10px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
form.card{display:grid;gap:10px}
label{font-size:.8rem;color:var(--mut);display:grid;gap:4px}
input,select{width:100%;background:#0a1230;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px;font:inherit;min-height:44px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;border:0;border-radius:10px;padding:11px 14px;min-height:44px;cursor:pointer;color:#fff;background:linear-gradient(90deg,var(--blue),var(--org));font-weight:600}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--txt);font-weight:500}
button.del{background:transparent;color:#ff7a7a;border:1px solid #ff7a7a55;min-height:36px;padding:6px 10px}
.item h3{margin:0 0 4px;font-size:1.05rem}
.meta{color:var(--mut);font-size:.9rem;display:grid;gap:2px}
.meta b{color:var(--txt);font-weight:600}
.pill{display:inline-block;background:#2fa3ff22;color:var(--blue);border-radius:99px;padding:2px 10px;font-size:.8rem;margin-left:6px}
.pill.o{background:#ff8a1f22;color:var(--org)}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.empty{color:var(--mut);text-align:center;padding:22px 10px}
.rec{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rec .t{font-size:1.4rem;font-weight:700;color:var(--org)}
.rec input{max-width:130px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0a1230ee;backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;background:none;color:var(--mut);font-size:.68rem;padding:6px 2px;display:grid;gap:2px;justify-items:center;font-weight:500;border-radius:8px}
nav button span{font-size:1.35rem}
nav button.on{color:var(--txt);background:#ffffff12}
nav button.on span{filter:drop-shadow(0 0 6px var(--org))}
section{display:none}section.on{display:block}
@media (prefers-reduced-motion:no-preference){section.on{animation:in .25s ease}@keyframes in{from{opacity:.4}to{opacity:1}}}
</style>
</head>
<body>
<header><img src="logo%20(1).png" alt=""><h1>Deportes</h1></header>
<main>

<section id="s-prox" class="on">
 <h2>Añadir carrera</h2>
 <form class="card" id="f-prox">
  <label>Nombre<input name="nombre" required></label>
  <div class="row"><label>Fecha<input type="date" name="fecha" required></label>
  <label>Hora de salida<input type="time" name="hora" required></label></div>
  <div class="row"><label>Distancia (km)<input type="number" step="0.01" min="0" name="dist" required></label>
  <label>Lugar de salida<input name="lugar" required></label></div>
  <button>Guardar carrera</button>
 </form>
 <h2>Próximas carreras</h2><div id="l-prox"></div>
</section>

<section id="s-dor">
 <h2>Recogida de dorsal</h2>
 <form class="card" id="f-dor">
  <label>Carrera<input name="carrera" list="dl-carreras" required placeholder="Elige o escribe"></label>
  <datalist id="dl-carreras"></datalist>
  <label>Dónde recoger<input name="donde" required></label>
  <div class="row"><label>Día<input type="date" name="fecha" required></label>
  <label>Horario<input name="horario" required placeholder="10:00 – 20:00"></label></div>
  <button>Guardar recogida</button>
 </form>
 <div id="l-dor"></div>
</section>

<section id="s-hec">
 <h2>Carrera hecha</h2>
 <form class="card" id="f-hec">
  <label>Nombre<input name="nombre" required></label>
  <div class="row"><label>Día<input type="date" name="fecha" required></label>
  <label>Distancia (km)<input type="number" step="0.01" min="0" name="dist" required></label></div>
  <label>Tiempo (h:mm:ss)<input name="tiempo" required placeholder="0:52:30" pattern="\d{1,2}:[0-5]\d:[0-5]\d|[0-5]?\d:[0-5]\d"></label>
  <button>Guardar carrera hecha</button>
 </form>
 <h2>Mis carreras</h2><div id="l-hec"></div>
</section>

<section id="s-rec">
 <h2>Mis récords</h2>
 <div id="l-rec"></div>
</section>

<section id="s-dis">
 <h2>Añadir distancia</h2>
 <form class="card" id="f-dis">
  <div class="row"><label>Nombre<input name="nombre" required placeholder="Media maratón"></label>
  <label>Distancia (km)<input type="number" step="0.01" min="0" name="km" required></label></div>
  <button>Añadir a mis récords</button>
 </form>
 <div id="l-dis"></div>
</section>

</main>

<nav id="nav">
 <button data-s="prox" class="on"><span>🏁</span>Carreras</button>
 <button data-s="dor"><span>🎽</span>Dorsal</button>
 <button data-s="hec"><span>✅</span>Hechas</button>
 <button data-s="rec"><span>🏆</span>Récords</button>
 <button data-s="dis"><span>📏</span>Distancias</button>
</nav>

<script>
const K='deportes_v1';
const base=[{id:'d5',nombre:'5K',km:5,base:1},{id:'d10',nombre:'10K',km:10,base:1},{id:'d21',nombre:'21K',km:21.0975,base:1},{id:'d42',nombre:'42K',km:42.195,base:1}];
let db=load();
function load(){try{const d=JSON.parse(localStorage.getItem(K));if(d)return d}catch(e){}
 return {prox:[],dor:[],hec:[],dis:base,rec:{}}}
function save(){try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fd=d=>d?new Date(d+'T00:00').toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short',year:'numeric'}):'';
const km=n=>(+n).toLocaleString('es-ES',{maximumFractionDigits:2})+' km';
function secs(t){const p=t.trim().split(':').map(Number);if(p.some(isNaN))return null;return p.length==3?p[0]*3600+p[1]*60+p[2]:p[0]*60+p[1]}
function fmt(s){const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=Math.round(s%60);return h+':'+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0')}
function pace(s,d){const p=s/d;return Math.floor(p/60)+':'+String(Math.round(p%60)).padStart(2,'0')+' min/km'}
function matchDist(d){return db.dis.find(x=>Math.abs(x.km-d)/x.km<0.03)}

// Navegación
$('#nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;
 document.querySelectorAll('nav button,section').forEach(x=>x.classList.remove('on'));
 b.classList.add('on');$('#s-'+b.dataset.s).classList.add('on');scrollTo(0,0)};

// Formularios
function bind(id,fn){$(id).onsubmit=e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));fn(o);e.target.reset();save();render()}}
bind('#f-prox',o=>db.prox.push({id:uid(),...o,dist:+o.dist}));
bind('#f-dor',o=>db.dor.push({id:uid(),...o}));
bind('#f-hec',o=>{const s=secs(o.tiempo);if(s==null){alert('Tiempo no válido');return}
 db.hec.push({id:uid(),nombre:o.nombre,fecha:o.fecha,dist:+o.dist,seg:s});autoRecord(+o.dist,s,o.nombre,o.fecha)});
bind('#f-dis',o=>db.dis.push({id:uid(),nombre:o.nombre,km:+o.km}));

function autoRecord(d,s,n,f){const x=matchDist(d);if(!x)return;const r=db.rec[x.id];
 if(!r||s<r.seg){db.rec[x.id]={seg:s,nombre:n,fecha:f};setTimeout(()=>alert('🏆 ¡Nuevo récord en '+x.nombre+'!'),50)}}

// Acciones
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;
 const {a,id}=b.dataset;
 if(a=='del-prox'&&confirm('¿Borrar carrera?'))db.prox=db.prox.filter(x=>x.id!=id);
 if(a=='del-dor'&&confirm('¿Borrar recogida?'))db.dor=db.dor.filter(x=>x.id!=id);
 if(a=='del-hec'&&confirm('¿Borrar carrera hecha?'))db.hec=db.hec.filter(x=>x.id!=id);
 if(a=='del-dis'&&confirm('¿Borrar distancia y su récord?')){db.dis=db.dis.filter(x=>x.id!=id);delete db.rec[id]}
 if(a=='done'){const c=db.prox.find(x=>x.id==id);const t=prompt('Tiempo que has tardado (h:mm:ss)','');if(!t)return;
  const s=secs(t);if(s==null){alert('Tiempo no válido');return}
  db.hec.push({id:uid(),nombre:c.nombre,fecha:c.fecha,dist:c.dist,seg:s});autoRecord(c.dist,s,c.nombre,c.fecha);
  db.prox=db.prox.filter(x=>x.id!=id)}
 if(a=='clr-rec'){delete db.rec[id]}
 save();render()});
document.addEventListener('change',e=>{const i=e.target.closest('[data-rec]');if(!i)return;
 const id=i.dataset.rec;if(!i.value){delete db.rec[id]}else{const s=secs(i.value);if(s==null){alert('Usa h:mm:ss');return}
 db.rec[id]={...(db.rec[id]||{}),seg:s}}save();render()});

// Pintar
function render(){
 const sp=[...db.prox].sort((a,b)=>(a.fecha+a.hora).localeCompare(b.fecha+b.hora));
 $('#l-prox').innerHTML=sp.length?sp.map(c=>`<div class="card item"><h3>${esc(c.nombre)}<span class="pill">${km(c.dist)}</span></h3>
  <div class="meta"><div>📅 <b>${fd(c.fecha)}</b> · ${esc(c.hora)}</div><div>📍 ${esc(c.lugar)}</div></div>
  <div class="acts"><button data-a="done" data-id="${c.id}">Marcar como hecha</button><button class="del" data-a="del-prox" data-id="${c.id}">Borrar</button></div></div>`).join(''):'<div class="empty">Aún no hay carreras. Añade la primera arriba.</div>';
 $('#dl-carreras').innerHTML=sp.map(c=>`<option value="${esc(c.nombre)}">`).join('');
 const sd=[...db.dor].sort((a,b)=>a.fecha.localeCompare(b.fecha));
 $('#l-dor').innerHTML=sd.length?sd.map(d=>`<div class="card item"><h3>${esc(d.carrera)}</h3>
  <div class="meta"><div>📍 <b>${esc(d.donde)}</b></div><div>📅 ${fd(d.fecha)}</div><div>🕐 ${esc(d.horario)}</div></div>
  <div class="acts"><button class="del" data-a="del-dor" data-id="${d.id}">Borrar</button></div></div>`).join(''):'<div class="empty">Sin recogidas de dorsal guardadas.</div>';
 const sh=[...db.hec].sort((a,b)=>b.fecha.localeCompare(a.fecha));
 $('#l-hec').innerHTML=sh.length?sh.map(h=>`<div class="card item"><h3>${esc(h.nombre)}<span class="pill o">${km(h.dist)}</span></h3>
  <div class="meta"><div>📅 ${fd(h.fecha)}</div><div>⏱️ <b>${fmt(h.seg)}</b> · ${pace(h.seg,h.dist)}</div></div>
  <div class="acts"><button class="del" data-a="del-hec" data-id="${h.id}">Borrar</button></div></div>`).join(''):'<div class="empty">Todavía no has registrado carreras hechas.</div>';
 const sdis=[...db.dis].sort((a,b)=>a.km-b.km);
 $('#l-rec').innerHTML=sdis.map(d=>{const r=db.rec[d.id];return `<div class="card"><div class="rec"><div><b>${esc(d.nombre)}</b><div class="meta">${km(d.km)}${r&&r.nombre?` · ${esc(r.nombre)}${r.fecha?', '+fd(r.fecha):''}`:''}</div>${r?`<div class="meta">${pace(r.seg,d.km)}</div>`:''}</div>
  <div style="text-align:right">${r?`<div class="t">${fmt(r.seg)}</div>`:''}<input data-rec="${d.id}" placeholder="${r?'Cambiar':'h:mm:ss'}" aria-label="Récord ${esc(d.nombre)}"></div></div></div>`}).join('');
 $('#l-dis').innerHTML=sdis.map(d=>`<div class="card rec"><div><b>${esc(d.nombre)}</b><div class="meta">${km(d.km)}</div></div>
  ${d.base?'<span class="pill">base</span>':`<button class="del" data-a="del-dis" data-id="${d.id}">Borrar</button>`}</div>`).join('');
}
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
